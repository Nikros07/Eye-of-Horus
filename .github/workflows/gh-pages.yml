name: Deploy frontend to GitHub Pages

# This publishes a fully static build of the frontend for browsing the UI
# with demo data end-to-end. It has no backend of its own — set the
# NEXT_PUBLIC_API_BASE repository variable to a deployed backend URL (see
# README) for it to show live data; otherwise API calls will simply fail
# and the UI falls back to its own loading/empty states.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          BUILD_TARGET: github-pages
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'http://localhost:8000' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
