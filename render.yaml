# Render Blueprint — a one-click free deploy of the FastAPI backend.
#
# Setup (no local tools, no credit card):
#   1. Sign up at https://render.com with GitHub (free).
#   2. Dashboard -> New -> Blueprint -> select the Eye-of-Horus repo.
#   3. Render reads this file automatically and shows the plan below.
#      Click "Apply" — that's it. No env vars need to be filled in; every
#      one below already has a value, and none of it needs a paid service.
#
# DATA_MODE below is set to "live": real events (NASA EONET + Open-Meteo)
# and real prices (Yahoo Finance via yfinance) — no API key needed for
# either, but Yahoo Finance is known to rate-limit/block requests from cloud
# datacenter IPs from time to time, which can leave a symbol's price data
# stale until the next successful fetch (the ingestion cycle degrades that
# one symbol gracefully rather than failing the whole cycle — see
# backend/app/services/market_engine/ingest.py). Set both back to "demo" for
# a 100%-reliable, zero-network-dependency deployment instead (synthetic but
# realistic events/prices, clearly flagged is_demo: true end-to-end).
#
# The free plan spins the service down after ~15 minutes idle and wakes it
# on the next request (cold start up to ~30s) — which also pauses the
# scheduler (automated ingestion + auto-trade loop) until the next request
# arrives. For genuinely continuous automated trading, ping the service
# every ~10 minutes (e.g. a free https://cron-job.org job hitting
# /api/health) to keep it from spinning down. The filesystem is ephemeral,
# so the SQLite database resets on every redeploy/restart — harmless, since
# the app reseeds its own demo data (and, in live mode, re-syncs real price
# history) on startup — see backend/app/services/bootstrap.py.
services:
  - type: web
    name: eye-of-horus-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      # demo = deterministic seeded generators, no external calls, no keys.
      # live = real connectors (NASA EONET, Open-Meteo, yfinance) — see the
      # note above on Yahoo Finance reliability.
      - key: DATA_MODE
        value: live
      - key: MARKET_DATA_PROVIDER
        value: yfinance
      # Leave false. Live trading additionally requires a real broker
      # adapter that does not exist yet — see backend/.env.example.
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DEFAULT_PAPER_CAPITAL
        value: "10000"
      - key: INGESTION_INTERVAL_SECONDS
        value: "300"
      # internal = PaperBroker simulates fills in-process (default, zero
      # setup). alpaca = real orders against Alpaca's free PAPER trading
      # account (still fake money) — only takes effect once both keys
      # below are also set. Leave as-is to keep the zero-setup default.
      - key: BROKER_PROVIDER
        value: internal
      # Optional. Leave unset (click "Skip") unless you want paper trades
      # to execute against a real (free, fake-money) Alpaca paper account
      # instead of the built-in simulator — get keys free at
      # alpaca.markets (dashboard -> Paper Trading -> API Keys), then also
      # set BROKER_PROVIDER=alpaca above.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      # The deployed GitHub Pages origin — update if you fork/rename the
      # repo, or add your own frontend's origin here (comma-separated
      # entries inside the JSON list below, e.g. also
      # "http://localhost:3000" while developing against this backend).
      - key: CORS_ORIGINS
        value: '["https://nikros07.github.io"]'
      # anthropic = ClaudeProvider (needs ANTHROPIC_API_KEY). gemini =
      # GeminiProvider (needs GEMINI_API_KEY instead — free-tier key, no
      # card required, from https://aistudio.google.com/apikey). Leave as
      # "anthropic" (and both keys unset/"Skip") to keep the deterministic
      # evidence synthesizer — the research layer works fully without this.
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # DATABASE_URL is intentionally not set here: it defaults to the
      # bundled SQLite file, which is all the free plan's ephemeral disk
      # needs. Add DATABASE_URL (pointing at a managed Postgres instance)
      # only if you want data to persist across restarts/redeploys.
